[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-metabolism-bistability"
version = "0.2.0"
description = "Coarse-grained ODE model for qualitative analysis of fatty-acid metabolism bi-stability."
authors = [{name = "Chilperic Armel Foko Kuate"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.4", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/chilperic/fatty-acid-metabolism-bistability"
Issues = "https://github.com/chilperic/fatty-acid-metabolism-bistability/issues"
